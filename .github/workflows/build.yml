# Builds the Android App Bundle on every push to main and puts the result on the "builds" branch.
name: Build app bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release bundle
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:bundleRelease 2>&1 | tee build.log

      - name: Publish the result to the builds branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no log" > build.log
          AAB="$GITHUB_WORKSPACE/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then cp "$AAB" app-release-unsigned.aab; echo success > STATUS; else echo failed > STATUS; fi
          echo "$GITHUB_SHA" > COMMIT
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA::7}: $(cat STATUS)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" builds
