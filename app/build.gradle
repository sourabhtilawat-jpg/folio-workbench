plugins {
    id 'com.android.application'
}

// Folio Workbench — developed by Sourabh Tilawat
android {
    namespace 'com.sourabhtilawat.folio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sourabhtilawat.folio'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '1.3.1'

        // ---- AdMob IDs ----------------------------------------------------------
        // Sourabh Tilawat's AdMob IDs (publisher pub-8777673532212285).
        manifestPlaceholders = [admobAppId: 'ca-app-pub-8777673532212285~2238818272']
        resValue 'string', 'admob_banner_id', 'ca-app-pub-8777673532212285/3416168579'
        resValue 'string', 'admob_interstitial_id', 'ca-app-pub-8777673532212285/3392117847'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['gz', 'woff2', 'png', 'wasm']
    }
}

dependencies {
    // Google Play Billing (Folio Pro one-time unlock). Play requires version 8 or newer.
    implementation 'com.android.billingclient:billing:8.0.0'
    // Google AdMob ads (free version only) and Google's consent form (UMP).
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
