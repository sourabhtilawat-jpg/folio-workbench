plugins {
    id 'com.android.application'
}

// Folio Workbench — developed by Sourabh Tilawat
android {
    namespace 'com.sourabhtilawat.folio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sourabhtilawat.folio'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.3.0'

        // ---- AdMob IDs ----------------------------------------------------------
        // These are Google's TEST IDs (safe to use, earn nothing). Before publishing,
        // replace all three with your own from admob.google.com > Apps / Ad units.
        manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
        resValue 'string', 'admob_banner_id', 'ca-app-pub-3940256099942544/9214589741'
        resValue 'string', 'admob_interstitial_id', 'ca-app-pub-3940256099942544/1033173712'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['gz', 'woff2', 'png', 'wasm']
    }
}

dependencies {
    // Google Play Billing (Folio Pro one-time unlock). Play requires version 8 or newer.
    implementation 'com.android.billingclient:billing:8.0.0'
    // Google AdMob ads (free version only) and Google's consent form (UMP).
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
