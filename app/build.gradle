plugins {
    id 'com.android.application'
}

// Folio Workbench — developed by Sourabh Tilawat
android {
    namespace 'com.sourabhtilawat.folio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sourabhtilawat.folio'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['gz', 'woff2', 'png', 'wasm']
    }
}

dependencies {
    // Google Play Billing (Folio Pro one-time unlock). Play requires version 8 or newer.
    implementation 'com.android.billingclient:billing:8.0.0'
}
